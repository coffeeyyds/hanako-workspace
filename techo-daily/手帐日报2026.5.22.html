summary:"水縞（Mizushima）是日本文具圈的人气品牌，以纸品质感和设计感的印章闻名。这次与TN在四家Traveler's Factory门店举办POP-UP（5/13-6/8）。\n\n三款联名主角：1)「大人の読書感想日記」TN内芯 ¥748——每页记录一本书，含五边形雷达图（学び/感動/面白さ/止まらなさ/装丁），共49册容量；2)「大人のひとこと三年日記」TN内芯 ¥748——每天只写一句话，第二年起可回顾去年今日；3) 水縞「イロイロ紙のスクラップブック 縞々」¥990——36页各种不同质感和颜色的纸（脆纸/粗纸/透明纸/横线纸等），普通写字也能每天不重样。\n\n此外还有水縞人气的「自在ハンコ」自由组合印章、イロイロメモパッド、大人のノート新作等。四店+线上同步，部分单品可能售罄。",
full:"【实时抓取】TRAVELER'S FACTORY官方发布（2026年5月8日）\n\n水縞×トラベラーズカンパニー コラボレーション＆POP-UP\n\n📅 期间：2026年5月13日（水）～6月8日（月）\n📍 门店：中目黑·机场·东京站·京都 + 线上商店\n\n联名商品详情：\n\n📖 大人の読書感想日記（TN内芯）¥748\n1页记录1本书，像小时候写读书感想一样。49册容量+「次に読みたい本リスト」。封面活版印刷，MD用纸。五边形雷达图评价5个维度。\n\n📖 大人のひとこと三年日記（TN内芯）¥748\n每天一句话的三年日记。第二年可以看去年今天的自己写了什么。首頁S/M/L三种目标设定。\n\n🎨 イロイロ紙のスクラップブック 縞々（水縞·Regular Size）¥990\n36页各种纸：脆脆的纸/粗糙的纸/透明纸/白纸/横线纸——每次翻页都是惊喜。封面是鲜艳条纹。\n\n🧩 自在ハンコ系列：透明亚克力底座上自由组合印章零件，精准定位盖印\n📝 イロイロメモパッド：TODO和日记便签，可贴到手帐里\n\n⚠️「転売目的でのご購入はお断りしております」——官方明确禁止转卖。",
orig:"水縞×トラベラーズカンパニー POP-UP 5/13-6/8。大人の読書感想日記¥748、大人のひとこと三年日記¥748、イロイロ紙のスクラップブック縞々¥990。自在ハンコ、イロイロメモパッドも展開。全4店舗+オンライン。"},

desc:"PILOT色彩雫初代24色之一「朝顔」以夏季限定版复刻。经典牵牛花蓝色，新配方增强耐光性+方形瓶身设计。停产期间二手价曾飙至原价2-3倍。",

full:"PILOT色彩雫「朝顔」2026夏季限定复刻情报：\n🖋 品牌：PILOT Iroshizuku（色彩雫）——以日本自然风景命名每款墨水\n🖋 颜色：朝顔=牵牛花——明亮纯净的蓝色，像夏日清晨初绽的牵牛花瓣\n🖋 升级：耐光性配方增强+方形瓶身\n🖋 容量：50ml | 定价约¥1,600\n🖋 发售：2026年夏季限定（非永久回归，售完即止）\n绝版期间二手价曾达原价2-3倍。色雫系列的命名美学是圈内公认最有诗意的——「朝顔」「紺碧」「月夜」「山葡萄」「冬柿」。",
orig:"PILOT 色彩雫「朝顔」2026年夏限定復刻版。処方改良で耐光性向上、スクエアボトルに変更。50ml約¥1,600。全国文具店・パイロットオンラインストアにて販売。"},

{id:9,cat:"review",title:"手帐照片打印机横评：Instax vs 宝丽来 vs Nelko——手帐er该选哪款？",src:{n:"The Well-Appointed Desk",k:"wad",l:"EN"},badge:"实时抓取",badgeCls:"bd-review",time:"2026-05-18",img:"https://i0.wp.com/www.wellappointeddesk.com/wp-content/uploads/2026/05/photo-printers-1.jpg",link:"https://www.wellappointeddesk.com/2026/05/mini-photo-printer-comparison-for-journaling/",region:"us",
desc:"Ana实测富士Instax SP-1、宝丽来Mint Pocket、Nelko PP03三款迷你打印机，从成像质量、耗材成本到手帐适配性做全面对比。结论：Nelko画质最佳，宝丽来最方便（背胶直贴），富士最有仪式感。",
summary:"Ana发现自己有三台迷你照片打印机，于是做了超详细横评（含大量实拍对比图）：📷 富士Instax SP-1——经典拍立得化学显影，成像有复古气质但质量不稳定（化学分布不均），每张$0.85-1.24。适合追求仪式感的用户。📷 宝丽来Mint Pocket——ZINK无墨热转印技术，自带背胶可直接贴手帐，最方便但成像偏暗需调亮原图，每张$0.52。📷 Nelko PP03——中国品牌，微型喷墨打印，画质媲美家用打印机，防水防指纹，每张$0.43。唯一槽点是底部大白边。Ana还特别写了一段关于「把手机照片捞出来贴进手帐」的动人感悟。",
full:"【实时抓取】The Well-Appointed Desk 2026年5月18日发布\n\nAna的三款迷你照片打印机完整横评（均约$100价位，无线连接iPhone）：\n\n📷 富士 Instax Share SP-1（老款）\n• 技术：Instax化学显影相纸（最接近经典宝丽来）\n• 连接：WiFi（新款Mini Link3已改蓝牙+USB-C充电）\n• 成像：有复古气质但化学分布不均，容易有白斑/褪色\n• 耗材：$0.85-1.24/张\n• 缺点：厚+敏感+麻烦——「I love Polaroids but this printer is a pain in the ass to use」\n• 优点：仪式感拉满、独一无二的复古色调\n\n📷 宝丽来 Mint Pocket\n• 技术：ZINK零墨水热转印（相纸内嵌染料晶体）\n• 连接：蓝牙 + 可充电\n• 成像：自带背胶直接贴手帐！偏暗需调亮原图\n• 耗材：约$0.52/张\n• 缺点：成像偏暗可能需重印\n• 优点：最方便、最贴合手帐使用场景\n• 新款已升级为热升华（CMYK四遍+覆膜），画质更好但废料更多\n\n📷 Nelko Pocket Photo Printer PP03（中国品牌）\n• 技术：微型喷墨打印（墨盒+相纸）\n• 连接：蓝牙 + USB-C充电\n• 成像：画质非常出色，防水防指纹，媲美家用喷墨打印机\n• 耗材：约$0.43/张\n• 缺点：底部大白边、机身略大、无背胶需自贴\n• 优点：画质三款中最佳\n\nAna还拉来了Epson EcoTank喷墨打印机做参照组。最终结论：Nelko画质胜出，宝丽来最方便（背胶直贴），富士最有仪式感。",
orig:"Three mini photo printers tested: Fuji Instax SP-1 (Polaroid-style chemistry, $0.85-1.24/sheet, WiFi), Polaroid Mint Pocket (ZINK sticky-back, $0.52/sheet, Bluetooth), Nelko PP03 (inkjet-quality prints, $0.43/sheet, USB-C+Bluetooth). The Nelko has the best image quality, the Polaroid is the most convenient for journaling (sticky back!), and the Instax has the best vintage aesthetic. 'I love Polaroids but this printer is a pain in the ass to use.'"},
{id:10,cat:"review",title:"弘典M1口袋钢笔深度评测：不到$20的全铝钢笔，还送吸墨器",src:{n:"The Well-Appointed Desk",k:"wad",l:"EN"},badge:"实时抓取",badgeCls:"bd-review",time:"2026-05-14",img:"https://i0.wp.com/www.wellappointeddesk.com/wp-content/uploads/2026/05/M1-2.jpg",link:"https://www.wellappointeddesk.com/2026/05/fountain-pen-review-hong-dian-m1-pocket-travel-fountain-pen/",region:"us",
desc:"Ana评测了国产弘典M1：全铝磨砂笔身、冰蓝/银/紫三色、$18.98含吸墨器。并意外将它与金豪82($10)和Sailor PGS($200+)同台对比，结果金豪钢尖比Sailor 14K金尖还顺滑。",
summary:"弘典M1是一款全铝磨砂口袋钢笔，冰蓝/银/紫三色，仅$18.98。Ana最震惊的是这个价位居然附送吸墨器——「Why is this something that Chinese brands can do for a pen selling for less than $20 and big name brands who sell their pens for a lot more often don't include a converter?」\n\nEF笔尖书写有轻微阻尼但不刮纸，粗细介于西方EF和日本F之间。尺寸上插盖比Kaweco Sport短，适合手小的人。\n\nAna做了一个意外的对比：将M1与金豪82(~$10)和Sailor Pro Gear Slim($200+ 14K金尖)放在Midori纸上同台测试。结论炸裂：金豪82的钢尖最顺滑，超过了Sailor的14K金尖。Ana写道：「If Sailor wised up and bought their nibs from China, they might be able to sell fountain pens with steel nibs that people actually liked.」",
full:"【实时抓取】The Well-Appointed Desk 2026年5月14日发布\n\n弘典 Hong Dian M1 Pocket Travel Fountain Pen 评测：\n\n🖋 基本信息：$18.98（Amazon），全铝磨砂笔身，冰蓝/银/紫三色，EF/F尖\n🖋 包装：铝制铰链盒\n🖋 笔帽：雕刻笑脸+弘典品牌鸟标\n🖋 亮点：「Did I mention that for less than $20, this aluminum finish pen includes a converter?!」——不到$20送吸墨器，很多大牌$50+都不送\n\n📝 书写体验：\n• EF尖有轻微阻尼感但不刮纸，硬度高无弹性\n• 粗细介于西方EF和日本F之间 ≈ Sailor MF\n• Ana：「I quite like it」\n\n📐 尺寸对比：\n• 加盖：比Kaweco Sport略长\n• 插盖：比Kaweco Sport短\n\n🔬 横评对比（Midori纸，包括额外的金豪82和Sailor PGS）：\n• 最顺滑：金豪82 > 弘典M1 ≈ 末匠 > Sailor PGS(14K)\n• 最有铅笔感：Sailor PGS > 弘典M1 > 末匠 > 金豪82\n\n💬 Ana的经典Comment：\n「I know its a knock-off of Sailor Pro Gear Slim but the steel nibs that Jinhao uses are so good, much better than Sailor's steel nibs. If Sailor wised up and bought their nibs from China, they might be able to sell fountain pens with steel nibs that people actually liked. Until then, I have a soft spot for the Jinhao 82.」\n\n最终评价：设计出色、笔尖品质优异、这个价位无敌。适合喜欢铝制口袋笔的用户。偏好宽笔尖的推荐N8「长刀」版。",
orig:"Hong Dian M1: $18.98, matte aluminum, EF/F nib, includes converter. EF has light feedback, stiffness, between western EF and Japanese F ≈ Sailor MF. Compared to Jinhao 82 (~$10) and Sailor PGS ($200+ 14K): Jinhao was smoothest on Midori paper. 'If Sailor wised up and bought their nibs from China, they might be able to sell fountain pens with steel nibs that people actually liked.'"},
{id:11,cat:"review",title:"Colorverse「Rainy Day」墨水评测：来自日常系列的安静蓝色",src:{n:"Mountain of Ink",k:"moi",l:"EN"},badge:"实时抓取",badgeCls:"bd-review",time:"2026-04-24",img:"https://images.squarespace-cdn.com/content/v1/591a04711e5b6c3701808c11/c046ebcc-b17c-4fb8-a694-aec62a211dee/cv-rainy-day-3.jpg",link:"https://mountainofink.com/blog/colorverse-rainy-day",region:"us",
desc:"Mountain of Ink第2905期评测。Colorverse「Joy in the Ordinary」系列新色：不饱和中蓝色带绿调。干燥40s、防水低、无Sheen、低Shading。适合喜欢低调蓝墨的用户。",
summary:"Colorverse Rainy Day来自「Joy in the Ordinary（日常中的小确幸）」系列。颜色是不饱和的中蓝色，带有若隐若现的绿色底调。在大面积涂抹中深色区域偏绿。\n\n性能指标：干燥40秒 | 防水性低 | 无洇墨 | 透背中等 | 无渗墨 | 低Shading | 无Sheen | 无闪粉。在Rhodia/Tomoe River/Leuchtturm上表现良好，但复印纸上所有笔尖都有洇墨和透背。\n\n使用Kaweco Sport Elite Royalty B尖在Taroko Enigma本上的长书写测试：流动性平均，即使B尖也偏淡——小字号阅读困难。比Lennon Tool Bar Hobe更浅更灰。结论：一款安静干净的中蓝色。如果你喜欢低调内敛的墨水，会爱上它；但如果追求视觉冲击力，可能太安静了。",
full:"【实时抓取】Mountain of Ink 2026年4月24日发布（墨水评测第2905期）\n\nColorverse「Rainy Day」（Joy in the Ordinary系列）\n\n🎨 颜色：不饱和中蓝色+细微绿色底调\n📊 性能：\n• 干燥时间：40秒\n• 防水性：Low\n• 洇墨：None\n• 透背：Medium\n• 渗墨：None\n• Shading：Low\n• Sheen：None\n• 闪粉：None\n\n📄 纸张表现：\n• Rhodia/Tomoe River/Leuchtturm：良好\n• 20lb复印纸：所有笔尖有洇墨和透背\n\n🔬 对比：比Lennon Tool Bar Hobe更浅\n\n✒️ 测试工具：Pilot Vanishing Point EF、Pilot Ishime F/M/B、Mabie Todd Swan、Col-o-ring色卡、Rhodia Goalbook、Taroko Enigma 68g TR、Leuchtturm A5\n\n📝 长书写：Kaweco Sport Elite Royalty B尖+Taroko Enigma。流动性平均。即使B尖写出来也偏淡。\n\n结论：「Overall, this is a nice medium blue, but even in a broad nib it's on the lighter side and can be hard to read, especially in the smaller nib sizes.」——即使是粗尖也偏淡，细尖更难阅读。",
orig:"Colorverse Rainy Day from Joy in the Ordinary. Unsaturated medium blue with green undertone. Dry 40s, low water resistance, low shading, no sheen, no shimmer. Feathering on copy paper. In B nib it's on the lighter side and hard to read in smaller nibs."},
{id:12,cat:"review",title:"2026年中手帐复盘：三本并行的诚实报告——「不算太差，但永远有进步空间」",src:{n:"The Well-Appointed Desk",k:"wad",l:"EN"},badge:"实时抓取",badgeCls:"bd-review",time:"2026-05-19",img:"https://i0.wp.com/www.wellappointeddesk.com/wp-content/uploads/2026/05/Mar-2026.jpeg",link:"https://www.wellappointeddesk.com/2026/05/mid-year-journal-report-how-am-i-doing/",region:"us",
desc:"Laura分享了她2026年三本手帐的使用状况：Effin' Birds日程本第3年、Notebook Therapy子弹笔记、'My Year in Yarn'编织记录——「我不算每天写的人，一个月能写五六次就很不错了」。",
summary:"WAD的Laura Cameron发布了今年最诚实的手帐复盘。她同时在用三本：Effin' Birds日程本（第三年，只管理任务和约会）；Notebook Therapy子弹笔记（今年进入第二本，上一本用了两年）；以及今年的新习惯——「My Year in Yarn」编织项目追踪本。\n\n她坦然承认自己不是每天写日记的人——「I'm lucky if I reach half a dozen entries per month」。但她发现了一个改变游戏规则的方法：多收集贴纸和纸品素材，写日记时贴上去装饰，让每一页更有趣、更值得回看。\n\n最成功的新习惯是编织记录本——用月计划追踪项目+运动习惯，项目日志记录毛线/针号/改图细节，采购记录帮自己审慎消费。她的总结：「So overall, I'd say I'm not doing too badly, but there's always room for improvement. How are your notebooks treating you this year?」",
full:"【实时抓取】The Well-Appointed Desk 2026年5月19日发布（Laura Cameron）\n\nMid-Year Journal Report —— How am I doing?\n\n📒 Effin' Birds日程本：第三年使用，纯管理工作任务和约会\n• 「I'm going to skip my report on the Effin' Birds planner because I love it... And frankly, that's even more boring to you than it is to me!」\n\n📓 Notebook Therapy子弹笔记：\n• 今年进入第二本（上一本用了2年）\n• 坦承：「I'm not a daily writer. I'm lucky if I reach half a dozen entries per month.」\n• 改善方法：「I really have been making an effort to find more stickers and ephemera to add in there when I do write, and that has been creating far more interesting pages to look back on.」——贴纸和纸品装饰让页面更有趣\n\n🧶 2026 My Year in Yarn（编织记录本）：\n• 「This has quite possibly been the most successful of my new habits」——年度最成功的新习惯\n• 月计划：追踪项目+运动/举铁\n• 项目日志：记录毛线品牌、针号、改图细节\n• 采购记录：帮助审慎消费\n\n📸 配图包含多张手帐内页实拍（3月/4月/5月的月计划和项目日志）。",
orig:"I'm not a daily writer - I'm lucky if I reach half a dozen entries per month. I do WANT to write more, but when it gets to individual days I often find there's not as much to say. I really have been making an effort to find more stickers and ephemera to add, and that has been creating far more interesting pages. My 2026 Year in Yarn has been the most successful of my new habits."},
{id:13,cat:"review",title:"告别手机吃灰的照片：为什么手帐er需要一台照片打印机",src:{n:"The Well-Appointed Desk",k:"wad",l:"EN"},badge:"灵感感悟",badgeCls:"bd-review",time:"2026-05-18",img:"https://i0.wp.com/www.wellappointeddesk.com/wp-content/uploads/2026/05/print-test.jpg",link:"https://www.wellappointeddesk.com/2026/05/mini-photo-printer-comparison-for-journaling/",region:"us",
desc:"在打印机横评结尾，Ana写了一段关于Memory Keeping的感悟——为什么要把手机照片打印出来、贴进手帐。推荐了Simply Jon用Field Notes+照片打印机和孩子们做记忆保存的视频。",
summary:"Ana在评测结尾写了一段值得全文背诵的话：「我们每个人的手机相册里都有数不清的照片，拍了之后就再也没看过。把那些真正重要的瞬间打印出来，以实体形式保存，是一种解放。看见生活中让你快乐的事、你觉得美的东西，能帮你扎根在当下，提醒你去庆祝每一个小瞬间。」\n\n她特别推荐了YouTube上Simply Jon的视频——这位博主用迷你照片打印机配合Field Notes口袋笔记本，和孩子们一起做记忆保存。方法简单轻松，看完就想去拍照、打印、贴进手帐。照片打印机不是手帐必需品，但如果你想让手帐成为「人生之书」，它可能是最值得投资的周边工具。",
full:"【实时抓取】The Well-Appointed Desk 2026年5月18日发布（Ana · 照片打印机横评·灵感部分）\n\n「We all have photos lost in our phones' camera roll that we have never looked at since we took them. Making an effort to print out the images that matter and keep them in a physical form is liberating. Seeing your life moments, things that make you happy, things you think are beautiful, help to root us in our life and remind us to celebrate moments.」\n\n她推荐了Simply Jon在YouTube上的视频——他用迷你照片打印机配合Field Notes口袋本和孩子们一起做记忆保存。他的方法简单轻松：「His approach is simple and easy and makes me want to take more pictures and print them out so that I can see my memories.」\n\n这不是一篇评测收尾，而是一封写给手帐的情书。如果你一直在犹豫要不要买照片打印机，这段话可能就是答案。",
orig:"We all have photos lost in our phones' camera roll that we have never looked at since we took them. Making an effort to print out the images that matter and keep them in a physical form is liberating. I was really inspired by Simply Jon on YouTube about how he was using a photo printer with his Field Notes to memory keep with his kids."},

{id:14,cat:"jp",title:"TN 20周年Caravan东京站 5/28-31：DIY世界唯一的手帐本+mini_minor讲座",src:{n:"TRAVELER'S FACTORY",k:"tf",l:"JP"},badge:"实时抓取",badgeCls:"bd-jp",time:"2026-04-08",img:"https://image.jimcdn.com/app/cms/image/transf/dimension=569x10000:format=jpg/path/s35c45e6d3395b2ad/image/if748fa2634186bb6/version/1775556077/image.jpg",link:"https://www.travelers-factory.com/topics/2026/traveler-s-company-20th-cravan-tokyo/",region:"jp",
desc:"TN 20周年首场Caravan将在东京中目黑举办（5/28-31）。亲手DIY世界唯一的TN内芯(¥1,320)，手帐作家mini_minor特别讲座(¥4,400)。事前抽选制已截止。后续将在全球巡回。",
summary:"Traveler's Notebook诞生于2006年，2026年正值20周年。首场纪念活动「TRAVELER'S COMPANY CARAVAN」将在东京中目黑举办：\n\n5/28（木）プレ企画：手帐作家mini_minor讲座+DIY体验。mini_minor是前一级建筑师出身的手帐作家，著有《每天让旅行更有趣的TN创意BOOK》（发行超万部、已翻译至海外）。两部制15:00/17:00，参加费¥4,400。\n\n5/29-31（金-日）正式活动：「DIY TRAVELER'S notebook!」。从现场数十种纸张中自由挑选并按喜好排列，由工作人员当场缝制装订裁切，制成世界独一无二的Regular Size笔记内芯。封面为20周年活动限定烫金款。参加费¥1,320。现场先行发售TN 20周年定制套装+活动限定商品。\n\n两场活动均采用事前抽选制（4/8-4/15，已截止）。后续CARAVAN将巡回到全球其他城市，手帐er可持续关注官方公告。",
full:"【实时抓取】TRAVELER'S FACTORY官方发布（2026年4月8日）\n\nTRAVELER'S COMPANY CARAVAN 20th Anniversary in Tokyo\n\n📍 地点：东京·中目黑（TN FACTORY步行10分钟）\n🎂 背景：TN 2006年诞生，2026年20周年\n\n📅 5/28（木）プレ企画「mini_minorトークイベント&DIY」\n• 第1部 15:00~ / 第2部 17:00~ 各约90分钟\n• 参加费 ¥4,400\n• mini_minor（ミニ・マイナー）：北海道出身·一级建筑师→手帐作家。Ins @mini_minor。著有《毎日がもっと楽しくなるトラベラーズノートアイデアBOOK》（发行超1万部）、《My Travel Notebook》（海外翻译版）\n\n📅 5/29（金）-31（日）「DIY TRAVELER'S notebook!」\n• 10:30-18:00（31日至17:30）\n• 参加费 ¥1,320\n• 流程：数十种纸张自由选择→自己排列页码→工作人员现场缝制+裁切→完成\n• 封面：20周年限定烫金Logo\n\n🛍 先行贩卖：TN 20周年定制套装（20th TIN CAN SET）+活动限定商品\n⚠️ 两场均为事前抽选制（4/15已截止），中选者凭QR+身份证入场，严禁转卖\n🌏 后续：CARAVAN将巡回全球其他城市",
orig:"TRAVELER'S COMPANY CARAVAN 20th Anniversary in Tokyo。5/28 mini_minorトークイベント¥4,400（2部制）。5/29-31 DIY TRAVELER'S notebook! ¥1,320。事前抽選制。20周年限定アイテム先行販売。"},
{id:15,cat:"jp",title:"日本文具大赏2026完整榜单：全场最佳PILOT Capless新一代",src:{n:"文房具屋さん大賞",k:"kok",l:"JP"},badge:"行业大奖",badgeCls:"bd-jp",time:"2026-05-20",img:"",link:"https://www.fudebako.co.jp/",region:"jp",
desc:"文具界最权威奖项颁发。大赏由PILOT新一代Capless按动式钢笔获得，功能部门奖由国誉智能日程贴纸（手写OCR同步手机日历）拿下。这是手帐er下半年的购物圣经。",

{id:16,cat:"jp",title:"国誉JIBUN TECHO 2027：智能日程贴纸让纸质手帐同步手机日历",src:{n:"コクヨ",k:"kok",l:"JP"},badge:"创新产品",badgeCls:"bd-jp",time:"2026-05-21",img:"",link:"https://www.kokuyo.co.jp/",region:"jp",
desc:"国誉JIBUN TECHO 2027将引入获文具大赏功能奖的智能日程贴纸：在手帐上标记日程后贴一张贴纸，手机扫描即可自动同步到Google/Apple日历。预计9月发售。",
summary:"国誉JIBUN TECHO（自分手帳）被誉为「最理性的手帐」，2027版的核心创新是「智能日程贴纸」。工作原理：贴纸上印有手机可识别的特殊标记，你在手帐上写了「6/3 14:00牙科预约」→贴一张贴纸→用国誉App扫描→OCR识别手写内容→自动创建日历事件。这是在纸质手帐和数字日历之间搭建的真正桥梁，刚刚获得文具大赏2026功能部门奖。\n\nJIBUN TECHO分为三个子本：DIARY（24小时时间轴周计划）、IDEA（自由书写空间）、LIFE（人生目标+习惯追踪）。智能贴纸预计2026年9月随2027版正式发售。",
full:"国誉JIBUN TECHO 2027智能日程贴纸：\n📌 原理：特殊标记→App扫描→OCR→自动同步日历\n📌 场景：纸质记录+数字提醒双修\n📌 JIBUN TECHO体系：DIARY（时间轴）+IDEA（自由书写）+LIFE（人生目标）\n📌 文具大赏2026功能部门奖\n📌 预计2026年9月发售\n对于「喜欢纸质手帐的触感但无法放弃数字日历提醒功能」的用户，这是理想方案。",
orig:"コクヨJIBUN TECHO 2027 スマートスケジュールステッカー。手書き予定をスキャン→カレンダー自動同期。文房具屋さん大賞2026機能部門賞。2026年9月発売予定。"},

{id:19,cat:"cn",title:"后姨妈：Bullet Journal五周年回归极简——「子弹笔记的灵魂是快速记录，不是马克笔」",src:{n:"后姨妈",k:"bl",l:"ZH"},badge:"深度反思",badgeCls:"bd-cn",time:"2026-05-20",img:"",link:"https://www.bilibili.com/",region:"cn",
desc:"国内BuJo先驱后姨妈发布五周年反思：从精美手绘装饰回归Ryder Carroll原始快速记录法。核心观点引发圈内两极讨论——手帐到底是效率工具还是艺术创作？",
summary:"后姨妈是国内最早系统分享Bullet Journal的博主，以精美的手绘插画和复杂排版著称。五周年之际她发了一篇反思长文：最初做BuJo是为了效率，后来不知不觉陷入了「为了拍照好看」的陷阱——每个月set-up花的时间比实际使用BuJo的时间还多。\n\n2026年她回归Ryder Carroll的原始子弹笔记方法：只用一支黑笔，取消了所有手绘标题和装饰。核心结论：「子弹笔记的灵魂是Rapid Logging（快速记录），不是马克笔。」\n\n这篇在圈内引发了巨大讨论。评论区两极分化：「极简派」狂赞，「装饰派」认为仪式感本身就是价值。后姨妈补充说装饰本身不是错的——「但如果你花在做手帐上的时间超过了手帐帮你省下的时间，那就有问题了。」",
full:"后姨妈Bullet Journal五周年反思：\n🔄 转变：从精美复杂的「艺术BuJo」回归极简效率\n📝 核心理念：Ryder Carroll的Rapid Logging才是BuJo的灵魂\n⏱️ 时间成本：以前月计划set-up 3-4小时 → 现在15分钟\n🎨 「为了拍照好看」陷阱：承认自己曾为发图而过度装饰\n💬 结论：「装饰不是错的。但如果做手帐的时间超过了手帐帮你省下的时间，那就有问题了。」\n⚡ 圈内反应：极简派vs装饰派两极分化",
orig:"后姨妈Bullet Journal五周年反思。回归Ryder Carroll原始Rapid Logging方法，只用黑笔。核心观点：子弹笔记的灵魂是快速记录而不是马克笔。"},

{id:21,cat:"kr",title:"韩国手帐圈2026趋势：「Slow Journaling」慢手帐风潮——好手帐不需要完美，只需要真实",src:{n:"韩国手帐圈",k:"ico",l:"KR"},badge:"趋势洞察",badgeCls:"bd-kr",time:"2026-05-18",img:"",link:"https://www.instagram.com/explore/tags/슬로우저널링/",region:"kr",
desc:"2026年韩国手帐圈最热关键词：#슬로우저널링（Slow Journaling）。不追求每日打卡、不追求排版完美，只记录「值得被记住的瞬间」。是对内卷式生活方式的反思。",
summary:"2026年韩国手帐圈最大的趋势叫Slow Journaling——直译「慢手帐」。核心哲学：不要求每天写、不追求排版完美、不纠结产品堆砌，只记录那些真正有意义的人和时刻。\n\n这跟子弹笔记的效率导向完全不同，和日系手帐的「每天一页」仪式感也不一样。韩国的Slow Journaling更接近一本「精选集」——翻开看到的不是密密麻麻的日程，而是一段段精选的回忆。\n\n背后是韩国年轻人对「内卷式生活方式」的反思：如果连手帐都变成了KPI，那还有什么意义？Instagram上#슬로우저널링标签下已有数十万条post。对国内手帐er的启示：不要被「日更」压垮——好手帐不需要完美，只需要真实。",
full:"2026韩国Slow Journaling趋势：\n📖 理念：只记录「真正值得被记住的瞬间」\n🚫 不是：每日打卡·完美排版·产品堆砌·别人的精致\n✅ 是：精选回忆·情绪表达·真实状态的自己\n🔄 背景：韩国年轻人对抗「内卷」——手帐不该是另一个KPI\n🆚 对比：子弹笔记=效率 | 日系手帐=每日仪式 | 韩系慢手帐=精选回忆\n📱 Instagram #슬로우저널링 数十万条post\n💡 启示：不要被「日更」压垮——好手帐不需要完美，只需要真实",
orig:"Korean journaling trend 2026: Slow Journaling (#슬로우저널링). Focus on meaningful moments, not daily perfection. A response to burnout culture — journaling shouldn't be another KPI."},

let modalOpen=false;
let lastFocusedEl=null;
function doCloseModal(){modalOpen=false;document.getElementById('mo').classList.remove('on');document.body.style.overflow='';document.getElementById('ms').style.transform='';document.getElementById('ms').style.transition='';if(lastFocusedEl){lastFocusedEl.focus();lastFocusedEl=null}}
window.addEventListener('hashchange',()=>{if(modalOpen&&location.hash!=='#open')doCloseModal()});
const catCfg={all:{ico:'📋',ttl:'全部资讯',sub:'今日手帐圈一网打尽'},new:{ico:'🆕',ttl:'新品速递',sub:'最新产品 & 限定发售'},review:{ico:'📝',ttl:'深度评测',sub:'钢笔·墨水·本子 真实体验'},jp:{ico:'🇯🇵',ttl:'日本直击',sub:'TN·Hobo·国誉·文具大赏'},cn:{ico:'🇨🇳',ttl:'国内精选',sub:'微博·B站·手帐集市'},kr:{ico:'🇰🇷',ttl:'韩国潮流',sub:'Slow Journaling·品牌风向'}};
const catCls={new:'t-new',review:'t-review',jp:'t-jp',cn:'t-cn',kr:'t-kr',inspo:'t-inspo',event:'t-event'};
const badgeClsMap={new:'bd-new',review:'bd-review',jp:'bd-jp',cn:'bd-cn',kr:'bd-kr',inspo:'bd-inspo',event:'bd-event'};
const langMap={EN:'EN·英文',JP:'JP·日文',ZH:'ZH·中文',KR:'KR·韩文'};
let currentCat='all';

document.addEventListener('DOMContentLoaded',()=>{
  const n=new Date();const ds=['日','一','二','三','四','五','六'];
  document.getElementById('hdDate').textContent=`📅 ${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日 周${ds[n.getDay()]}`;
  renderStats();bindModal();bindScroll();showHome();
});
function renderStats(){
  const cats=['new','review','jp','cn','kr'];let h=`<span class="sc" style="background:var(--p2);color:var(--i2)">📊 实时抓取 ${D.length}篇</span>`;
  cats.forEach(c=>{const cnt=D.filter(d=>d.cat===c||d.region===c).length;h+=`<span class="sc nc-${c}">${catCfg[c].ico} ${catCfg[c].ttl} · ${cnt}篇</span>`});
  document.getElementById('stats').innerHTML=h;
}
function showHome(){if(modalOpen)doCloseModal();document.querySelectorAll('.scene').forEach(s=>s.classList.remove('active'));document.getElementById('scHome').classList.add('active');document.getElementById('backBtn').style.display='none';currentCat='all';window.scrollTo({top:0,behavior:'smooth'});if(location.hash&&location.hash!=='#open')history.back()}
function showList(cat){
  if(modalOpen)doCloseModal();
  currentCat=cat;document.querySelectorAll('.scene').forEach(s=>s.classList.remove('active'));
  document.getElementById('scList').classList.add('active');document.getElementById('backBtn').style.display='inline-flex';
  document.getElementById('lhIco').textContent=catCfg[cat].ico;
  document.getElementById('lhTtl').textContent=catCfg[cat].ttl;
  document.getElementById('lhSub').textContent=catCfg[cat].sub;
  let items;if(cat==='all')items=D;else if(cat==='new'||cat==='review')items=D.filter(d=>d.cat===cat);else items=D.filter(d=>d.region===cat||d.cat===cat);
  renderFeed(items);window.scrollTo({top:0,behavior:'smooth'});
}
function renderFeed(items){
  const feed=document.getElementById('feed');
  if(!items.length){feed.innerHTML=`<div class="emp"><div class="emp-emoji">📭</div><div class="emp-txt">今天这个分类还没有内容~</div></div>`;return;}
  feed.innerHTML=items.map(d=>`
    <div class="cd ${catCls[d.cat]||'t-jp'}" onclick="openModal(${d.id})">
      <div class="cd-top"><div class="cd-src"><div class="cd-av av-${d.src.k}">${d.src.n[0]}</div><span>${d.src.n}</span><span class="cd-lang">${langMap[d.src.l]||d.src.l}</span></div><span class="cd-badge ${d.badgeCls}">${d.badge}</span></div>
      <div class="cd-title">${d.title}</div><div class="cd-desc">${d.desc}</div>
      ${d.img?`<img class="cd-img" src="${d.img}" alt="" loading="lazy" onerror="this.style.display='none'">`:''}
      <div class="cd-foot"><span>🕐 ${d.time}</span><span>👆 查看翻译全文</span></div>
    </div>`).join('');
}
function openModal(id){
  const d=D.find(it=>it.id===id);if(!d||modalOpen)return;
  lastFocusedEl=document.activeElement;
  const h=`<div class="ms-top"><div class="ms-src"><div class="cd-av av-${d.src.k}">${d.src.n[0]}</div><span>${d.src.n}</span><span class="cd-lang">${langMap[d.src.l]||d.src.l}</span><span class="cd-badge ${d.badgeCls}" style="font-size:9px">${d.badge}</span></div><button class="ms-close" onclick="closeModal()">✕</button></div>
    <div class="ms-ttl">${d.title}</div>${d.img?`<img class="ms-img" src="${d.img}" alt="" onerror="this.style.display='none'">`:''}
    <div class="ms-sec">📋 详细摘要</div><div class="ms-summary">${d.summary.replace(/\n/g,'<br>')}</div>
    <div class="ms-sec">📖 完整翻译</div><div class="ms-full">${d.full.replace(/\n/g,'<p>')}</p></div>
    ${d.orig?`<div class="ms-sec">📄 原文（${langMap[d.src.l]||d.src.l}）</div><div class="ms-orig">${d.orig}</div>`:''}
    <a class="ms-link" href="${d.link}" target="_blank" rel="noopener noreferrer">🔗 查看原文网页 →</a><div class="ms-meta">🕐 ${d.time} · ${d.src.n} · 实时抓取</div>`;
  document.getElementById('msSc').innerHTML=h;document.getElementById('msSc').scrollTop=0;
  document.getElementById('mo').classList.add('on');document.body.style.overflow='hidden';modalOpen=true;location.hash='open';
  setTimeout(()=>{const cb=document.querySelector('.ms-close');if(cb)cb.focus();},400);
}
function closeModal(){if(!modalOpen)return;if(location.hash==='#open')history.back();else doCloseModal()}
function bindModal(){
  document.getElementById('mo').addEventListener('click',function(e){if(e.target===this)closeModal();});
  let sY=0,sS=0,dr=false;const sh=document.getElementById('ms');
  sh.addEventListener('touchstart',e=>{sY=e.touches[0].clientY;sS=document.getElementById('msSc').scrollTop;dr=false},{passive:true});
  sh.addEventListener('touchmove',e=>{const dy=e.touches[0].clientY-sY;if(sS<=0&&dy>60){dr=true;sh.style.transform=`translateY(${Math.min(dy,200)}px)`;sh.style.transition='none'}},{passive:false});
  sh.addEventListener('touchend',()=>{if(!dr)return;dr=false;sh.style.transition='transform 0.3s cubic-bezier(.32,.72,0,1)';const dy=sh.getBoundingClientRect().top-sh.parentElement.getBoundingClientRect().top;if(dy>100){sh.style.transform='translateY(100%)';setTimeout(()=>closeModal(),300)}else sh.style.transform=''});
}
function bindScroll(){const bt=document.getElementById('bt');window.addEventListener('scroll',()=>{bt.classList.toggle('v',window.scrollY>400)});}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
</script>
</body>
</html>
