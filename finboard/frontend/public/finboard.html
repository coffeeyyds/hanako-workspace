.mr .ml{color:var(--m)}.mr .mv{text-align:right}

.tb tr:hover td{background:rgba(30,42,58,.2)}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:5px}
.cgi{text-align:center;background:rgba(10,14,20,.5);border-radius:6px;padding:8px 3px}
.cgi .cn{font-size:8px;color:var(--m);margin-bottom:2px}
.cgi .cp{font-size:10px;font-weight:700}
.poly-i{display:flex;justify-content:space-between;align-items:flex-start;padding:5px 0;gap:8px;font-size:10px;border-bottom:1px solid rgba(30,42,58,.3)}

.ft{text-align:center;padding:18px;font-size:9px;color:var(--m);border-top:1px solid var(--b);margin-top:20px}
.ft span{color:var(--blu)}
.kv{font-size:10px;color:var(--m);padding:10px 0}
.ch{width:100%;height:420px;background:var(--bg);border-radius:0 0 10px 10px}
.sb{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sb input{flex:1;min-width:100px;background:var(--bg);border:1px solid var(--b);color:var(--t);padding:6px 10px;border-radius:5px;font-size:11px;font-family:'Cascadia Code',monospace;outline:none}

  h+='<div class="c"><div class="ct">Ethereum (ETH) <span class="tag live">实时</span></div><div class="mr"><span class="ml">价格</span><span class="mv mn" style="font-size:18px;font-weight:700">$'+Number(c.eth_price).toLocaleString()+'</span></div><div class="mr"><span class="ml">24h 涨跌</span><span class="mv">'+PL(c.eth_change_24h)+'</span></div><div class="mr2"><div class="mr"><span class="ml">恐惧贪婪指数</span><span class="mv mn" style="font-size:16px;color:'+(c.fear_greed_value>60?'var(--g)':c.fear_greed_value<40?'var(--r)':'var(--y)')+'">'+c.fear_greed_value+' <span style="font-size:12px;font-weight:400">'+c.fear_greed_classification+'</span></span></div></div></div>';
  h+='</div>';
  return h;
}

function rMacro(){
  var m=DATA.macro_indicators,b=DATA.bond_snapshot,f=DATA.fx_snapshot;
  var h='<div class="r4">';
  h+='<div class="c"><div class="ct">📊 物价</div><div class="mr"><span class="ml">CPI 同比</span><span class="mv mn">'+F(m.cpi_yoy,1)+'%</span></div><div class="mr"><span class="ml">PPI 同比</span><span class="mv mn">'+F(m.ppi_yoy,1)+'%</span></div><div class="mr"><span class="ml">PMI 制造业</span><span class="mv mn '+C(m.pmi_manufacturing-50)+'">'+F(m.pmi_manufacturing,1)+'</span></div></div>';
  h+='<div class="c"><div class="ct">💰 货币</div><div class="mr"><span class="ml">M2 同比</span><span class="mv mn">'+F(m.m2_yoy,1)+'%</span></div><div class="mr"><span class="ml">社融增量</span><span class="mv mn">'+F(m.social_financing,1)+' 万亿</span></div><div class="mr"><span class="ml">外汇储备</span><span class="mv mn">$'+F(m.foreign_reserves,2)+'T</span></div></div>';
  h+='<div class="c"><div class="ct">🏦 利率</div><div class="mr"><span class="ml">LPR 1Y</span><span class="mv mn">'+F(b.lpr_1y)+'%</span></div><div class="mr"><span class="ml">LPR 5Y</span><span class="mv mn">'+F(b.lpr_5y)+'%</span></div><div class="mr"><span class="ml">Shibor 隔夜</span><span class="mv mn">'+F(b.shibor_on,4)+'%</span></div></div>';
  h+='<div class="c"><div class="ct">💱 汇率</div><div class="mr"><span class="ml">USD/CNY</span><span class="mv mn">'+F(f.usd_cny,4)+'</span></div><div class="mr"><span class="ml">EUR/USD</span><span class="mv mn">'+F(f.eur_usd,4)+'</span></div><div class="mr"><span class="ml">USD/JPY</span><span class="mv mn">'+F(f.usd_jpy,2)+'</span></div></div>';
  h+='</div>';
  h+='<div class="c"><div class="ct">🤖 AI 最新动向</div>';
  var an=DATA.ai_news;
  for(var i=0;i<an.length;i++){var n=an[i];h+='<div style="padding:5px 0;border-bottom:1px solid rgba(30,42,58,.3);font-size:10px"><span style="color:var(--blu);font-weight:600">['+n.source+']</span> <span style="color:var(--t)">'+n.title+'</span> <span style="color:var(--m);float:right">'+n.date+'</span></div>'}
  h+='</div>';
  return h;
}

var chartLoaded=false,chart=null,candle=null;
function loadChartLib(cb){
  if(typeof LightweightCharts!=='undefined'){chartLoaded=true;cb();return}
  var s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js';
  s.onload=function(){chartLoaded=true;cb()};
  s.onerror=function(){Q('#ccont').innerHTML='<div style="text-align:center;padding:40px;color:var(--m)">📉 K线图需要网络加载图表库<br><span style="font-size:10px">其他数据不受影响</span></div>'};
  document.head.appendChild(s);
}
function initChart(){
  var c=Q('#ccont');if(!c)return;
  loadChartLib(function(){
    if(chart)try{chart.remove()}catch(e){}
    chart=LightweightCharts.createChart(c,{width:c.clientWidth,height:420,layout:{background:{color:'#0a0e14'},textColor:'#5c6e80'},grid:{vertLines:{color:'#1e2a3a'},horzLines:{color:'#1e2a3a'}},crosshair:{mode:0},timeScale:{borderColor:'#1e2a3a'},rightPriceScale:{borderColor:'#1e2a3a'}});
    candle=chart.addCandlestickSeries({upColor:'#00d4aa',downColor:'#ff4757',borderUpColor:'#00d4aa',borderDownColor:'#ff4757',wickUpColor:'#00d4aa',wickDownColor:'#ff4757'});
    window.addEventListener('resize',function(){if(chart&&c)chart.applyOptions({width:c.clientWidth})});
    updChart(cSym);
  });
}
function updChart(sym){
  var bp=15,data=[],p=bp,now=new Date();
  for(var i=60;i>=0;i--){var d=new Date(now);d.setDate(d.getDate()-i);var ts=d.toISOString().split('T')[0];var ch=(Math.random()-0.48)*p*0.03,o=p,c2=p+ch,h=Math.max(o,c2)+Math.random()*p*0.01,l=Math.min(o,c2)-Math.random()*p*0.01;data.push({time:ts,open:+o.toFixed(2),high:+h.toFixed(2),low:+l.toFixed(2),close:+c2.toFixed(2)});p=c2}
  if(candle)candle.setData(data);Q('#cn').textContent=sym;
}
function selS(sym){cSym=sym;updChart(sym);QA('.sb .bt').forEach(function(b){b.className='bt'+(b.textContent===sym?' on':'')})}

function render(){
  var m=Q('#main');
  if(tab==='dash')m.innerHTML=rDash();
  else if(tab==='stocks'){m.innerHTML=rStocks();setTimeout(initChart,200)}
  else if(tab==='crypto')m.innerHTML=rCrypto();
  else if(tab==='macro')m.innerHTML=rMacro();
}

QA('nav a').forEach(function(a){a.addEventListener('click',function(){QA('nav a').forEach(function(x){x.classList.remove('on')});a.classList.add('on');tab=a.dataset.tab;render()})});

render();
</script>
