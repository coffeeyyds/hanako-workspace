<style>
  :root {
    --bg: #0f1119;
    --surface: #1a1d2e;
    --card: #1e2135;
    --border: #2a2d40;
    --text: #e2e4ed;
    --text2: #9599ad;
    --gold: #f0a500;
    --green: #4ade80;
    --red: #f87171;
    --blue: #6366f1;
    --purple: #a78bfa;
    --cyan: #22d3ee;
    --radius: 14px;
    --shadow: 0 4px 24px rgba(0,0,0,.3);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
    background: radial-gradient(ellipse at 30% 20%, rgba(99,102,241,.08) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(240,165,0,.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(74,222,128,.04) 0%, transparent 50%);
    pointer-events: none; z-index: 0;
  }
  /* skip-link */
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .sr-only:focus{position:fixed;top:10px;left:10px;width:auto;height:auto;clip:auto;padding:8px 16px;background:var(--blue);color:#fff;font-weight:600;border-radius:8px;z-index:999;white-space:nowrap}

  /* ── Header ── */
  .header {
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    background: rgba(15,17,25,.85);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
  }
  .header-title {
    font-size: 1.3rem; font-weight: 700; letter-spacing: -.02em;
    display: flex; align-items: center; gap: 10px;
  }
  .header-title .icon { font-size: 1.5rem; }
  .countdown {
    display: flex; align-items: center; gap: 8px;
    background: var(--card); padding: 8px 16px; border-radius: 30px;
    font-size: .9rem; border: 1px solid var(--border);
  }
  .countdown-num {
    font-size: 1.6rem; font-weight: 800; color: var(--gold);
    line-height: 1;
  }
  .progress-bar-wrap {
    flex: 1; min-width: 120px; max-width: 280px;
    height: 6px; background: var(--border); border-radius: 10px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%; border-radius: 10px;
    background: linear-gradient(90deg, var(--blue), var(--purple));
    transition: width .5s cubic-bezier(.4,0,.2,1);
  }
  .progress-text { font-size: .8rem; color: var(--text2); white-space: nowrap; }

  /* ── Layout ── */
  .app {
    display: flex; height: calc(100vh - 68px); position: relative; z-index: 1;
  }
  .sidebar {
    width: 240px; min-width: 240px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto; padding: 8px 0;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  .day-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; cursor: pointer;
    transition: all .15s; border-left: 3px solid transparent;
    font-size: .85rem; position: relative;
  }
  .day-item:hover { background: rgba(255,255,255,.03); }
  .day-item.active {
    background: rgba(99,102,241,.1);
    border-left-color: var(--blue);
  }
  .day-item.completed .day-check { background: var(--green); border-color: var(--green); }
  .day-item.completed .day-check::after {
    content: '✓'; color: #000; font-size: .65rem; font-weight: 800;
  }
  .day-check {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--border); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
  }
  .day-label { flex: 1; }
  .day-label small { display: block; color: var(--text2); font-size: .7rem; margin-top: 1px; }
  .day-badge {
    font-size: .65rem; padding: 2px 6px; border-radius: 8px;
    background: rgba(240,165,0,.15); color: var(--gold);
  }
  .day-badge.work { background: rgba(148,163,184,.1); color: var(--text2); }

  .jump-today {
    display: none; padding: 8px 16px; text-align: center;
  }
  .jump-today .btn-jump {
    background: var(--blue); color: #fff; border: none;
    padding: 6px 16px; border-radius: 20px; font-size: .8rem;
    cursor: pointer; font-family: inherit;
  }
  @media(max-width:720px){.jump-today{display:block}}

  /* ── Main ── */
  .main {
    flex: 1; overflow-y: auto; padding: 24px 28px;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .main::-webkit-scrollbar { width: 4px; }
  .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  .day-header {
    margin-bottom: 20px;
  }
  .day-header h2 {
    font-size: 1.6rem; font-weight: 700;
    display: flex; align-items: center; gap: 10px;

  .day-header .date { color: var(--text2); font-size: .9rem; font-weight: 400; }
  .day-tag {
    display: inline-block; padding: 4px 12px; border-radius: 20px;
    font-size: .75rem; font-weight: 600; margin-left: 8px;
  }
  .day-tag.fire { background: rgba(240,165,0,.15); color: var(--gold); }
  .day-tag.work { background: rgba(148,163,184,.1); color: var(--text2); }

  .stage-banner {
    background: linear-gradient(135deg, rgba(99,102,241,.12), rgba(168,123,250,.08));
    border: 1px solid rgba(99,102,241,.2);
    border-radius: var(--radius); padding: 12px 18px; margin-bottom: 18px;
    font-size: .85rem; color: var(--text2);
  }
  .stage-banner strong { color: var(--purple); }

  .task-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px; margin-bottom: 10px;
    display: flex; align-items: flex-start; gap: 14px;
    transition: all .2s; position: relative;

  .task-card:hover { border-color: rgba(255,255,255,.1); }
  .task-card.done { opacity: .7; border-left: 3px solid var(--green); }
  .task-card.done .task-content { text-decoration: line-through; text-decoration-color: var(--text2); }

  .task-cb {
    width: 22px; height: 22px; border-radius: 6px;
    border: 2px solid var(--border); flex-shrink: 0; margin-top: 1px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all .2s;
  }
  .task-cb:hover { border-color: var(--blue); }
  .task-cb:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .task-cb.checked {
    background: var(--green); border-color: var(--green);
  }
  .task-cb.checked::after {
    content: '✓'; font-size: .7rem; font-weight: 800; color: #000;
  }

  .task-body { flex: 1; min-width: 0; }
  .task-meta {
    display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
    flex-wrap: wrap;
  }
  .task-time {
    font-size: .75rem; color: var(--text2);
    background: rgba(255,255,255,.04); padding: 2px 8px; border-radius: 10px;
  }
  .task-dur {
    font-size: .75rem; color: var(--cyan);
    background: rgba(34,211,238,.1); padding: 2px 8px; border-radius: 10px;
  }
  .task-cat {
    font-size: .7rem; padding: 2px 8px; border-radius: 10px;
    font-weight: 600; text-transform: uppercase;
  }
  .task-cat.word { background: rgba(240,165,0,.12); color: var(--gold); }
  .task-cat.video { background: rgba(99,102,241,.12); color: var(--blue); }
  .task-cat.listen { background: rgba(168,123,250,.12); color: var(--purple); }
  .task-cat.exam { background: rgba(248,113,113,.12); color: var(--red); }
  .task-cat.review { background: rgba(74,222,128,.12); color: var(--green); }
  .task-cat.other { background: rgba(148,163,184,.1); color: var(--text2); }

  .task-content { font-size: .92rem; margin-bottom: 4px; line-height: 1.45; }
  .task-note {
    font-size: .78rem; color: var(--text2); line-height: 1.4;
  }
  .task-actions { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }

  .btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 14px; border-radius: 20px; font-size: .78rem;
    border: 1px solid var(--border); cursor: pointer;
    background: transparent; color: var(--text);
    transition: all .15s; text-decoration: none;
    font-family: inherit;

  .btn:hover { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.15); }
  .btn.play { border-color: rgba(99,102,241,.3); color: var(--blue); }
  .btn.play:hover { background: rgba(99,102,241,.1); }
  .btn.search { border-color: rgba(34,211,238,.2); color: var(--cyan); font-size: .73rem; }

    margin-top: 20px; padding-top: 16px;
    border-top: 1px solid var(--border);

    color: var(--text2); font-size: .85rem;

    .sidebar {
      width: 100%; min-width: 0; max-height: 140px;
      display: flex; overflow-x: auto; overflow-y: hidden;
      border-right: none; border-bottom: 1px solid var(--border);
      padding: 8px; gap: 4px;
    }
    .sidebar::-webkit-scrollbar { height: 3px; }
    .day-item {
      flex-direction: column; align-items: center; gap: 4px;
      padding: 8px 12px; border-left: none; border-bottom: 2px solid transparent;
      min-width: 60px; text-align: center; font-size: .75rem;
      white-space: nowrap;
    }
    .day-item.active { border-left: none; border-bottom-color: var(--blue); }
    .main { padding: 16px; }
    .header { padding: 10px 14px; }
    .header-title { font-size: 1rem; }
    .countdown { padding: 6px 12px; }
    .countdown-num { font-size: 1.3rem; }
    .progress-bar-wrap { max-width: 140px; }
  }
</style>
</head>

// ═══════════════════ APP LOGIC ═══════════════════
const EXAM_DATE = new Date(2026,5,13);
const STORAGE_KEY = 'cet6_tracker_v2';

function getTodayIndex() {
  const now = new Date();
  const start = new Date(2026,4,22);
  const diff = Math.floor((now - start) / 86400000);
  return Math.max(0, Math.min(21, diff));
}

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}
function saveState(state) { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function calcProgress(state) {
  let completedDays = 0;
  planData.forEach((d,i) => {
    const dayKey = 'day' + (i+1);
    const tasks = state[dayKey] || {};
    const totalTasks = d.tasks.length;
    const doneTasks = Object.values(tasks).filter(v=>v).length;
    if (totalTasks > 0 && doneTasks >= totalTasks) completedDays++;
  });
  return completedDays;
}

function getDayState(state, dayNum) {
  return state['day' + dayNum] || {};
}

// Render sidebar with ARIA roles
function renderSidebar(activeDay) {
  const sidebar = document.getElementById('sidebar');
  const state = loadState();
  let html = '<div class="jump-today"><button class="btn-jump" onclick="switchDay(getTodayIndex()+1)">📍 跳到今天</button></div>';
  planData.forEach((d,i) => {
    const dn = i+1;
    const dayState = getDayState(state, dn);
    const allDone = d.tasks.length > 0 && d.tasks.every((_,ti) => dayState['t'+ti]);
    const isActive = dn === activeDay;
    const cls = ['day-item', isActive ? 'active' : '', allDone ? 'completed' : ''].filter(Boolean).join(' ');
    html += '<div class="'+cls+'" data-day="'+dn+'" onclick="switchDay('+dn+')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();switchDay('+dn+')}" role="tab" aria-selected="'+(isActive?'true':'false')+'" tabindex="'+(isActive?'0':'-1')+'">'
      + '<div class="day-check"></div>'
      + '<div class="day-label">Day '+dn+'<small>'+d.date+' '+d.wd+'</small></div>'
      + '<span class="day-badge '+(d.type==='work'?'work':'')+'">'+(d.type==='fire'?'🔥':d.total)+'</span>'
      + '</div>';
  });
  sidebar.innerHTML = html;
  setTimeout(() => {
    const el = sidebar.querySelector('[data-day="'+activeDay+'"]');
    if (el) el.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }, 100);
}

function renderMain(dayNum) {
  const d = planData[dayNum-1];
  const state = loadState();
  const dayState = getDayState(state, dayNum);
  const dn = dayNum;
  const stage = STAGES.find(s => dn >= s.range[0] && dn <= s.range[1]);
  const tag = d.type === 'fire' ? TAG_FIRE : TAG_WORK;
  const allDone = d.tasks.length > 0 && d.tasks.every((_,ti) => dayState['t'+ti]);

  let html = '<div class="day-header"><h2>Day '+dn+' <span class="date">· '+d.date+' '+d.wd+'</span>'+tag+'</h2></div>';

  if (stage) {
    html += '<div class="stage-banner">'+stage.icon+' <strong>第'+(stage.range[0]>=15?'三':stage.range[0]>=8?'二':'一')+'阶段：'+stage.name+'</strong>'+(dn===stage.range[0]?' — 今天进入新阶段！':'')+'</div>';
  }
  if (allDone) {
    html += '<div class="stage-banner" style="background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.2);">✅ 今天的任务全部完成！干得漂亮。</div>';
  }

  d.tasks.forEach((t,ti) => {
    const isDone = !!dayState['t'+ti];
    const catLabel = {word:'单词',video:'视频',listen:'听力',exam:'真题',review:'复习',other:'其他'}[t.cat];
    const cardClass = 'task-card' + (isDone ? ' done' : '');

    html += '<div class="'+cardClass+'" id="task-'+dn+'-'+ti+'">'
      + '<div class="task-cb '+(isDone?'checked':'')+'" data-day="'+dn+'" data-ti="'+ti+'" onclick="toggleTask('+dn+','+ti+')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();toggleTask('+dn+','+ti+')}" role="checkbox" aria-checked="'+(isDone?'true':'false')+'" tabindex="0"></div>'
      + '<div class="task-body">'
      + '<div class="task-meta">'
      + (t.time?'<span class="task-time">'+t.time+'</span>':'')
      + (t.dur&&t.dur!=='-'?'<span class="task-dur">'+t.dur+'</span>':'')
      + '<span class="task-cat '+t.cat+'">'+catLabel+'</span>'
      + '</div>'
      + '<div class="task-content">'+t.text+'</div>'
      + (t.note?'<div class="task-note">💡 '+t.note+'</div>':'')
      + (t.actions&&t.actions.length?'<div class="task-actions">'+t.actions.map(a=>'<a class="btn '+(a.label.includes('打开')||a.label.includes('B站')?'play':'search')+'" href="'+a.url+'" target="_blank" rel="noopener noreferrer" title="'+(a.tip||'')+'">'+a.label+'</a>').join('')+'</div>':'')
      + '</div></div>';
  });

  html += '<div class="day-footer">⏱️ 今日总计 <strong>'+d.total+'</strong>'+(allDone ? ' · ✅ 全部完成' : ' · '+d.tasks.filter((_,ti)=>dayState['t'+ti]).length+'/'+d.tasks.length+' 项完成')+'</div>';
  document.getElementById('mainContent').innerHTML = html;
}

function toggleTask(dayNum, ti) {
  const state = loadState();
  const dayKey = 'day' + dayNum;
  if (!state[dayKey]) state[dayKey] = {};
  state[dayKey]['t'+ti] = !state[dayKey]['t'+ti];
  saveState(state);
  renderMain(dayNum);
  renderSidebar(dayNum);
  updateGlobalProgress();
}

function switchDay(dayNum) {
  renderMain(dayNum);
  renderSidebar(dayNum);
  window.location.hash = 'day' + dayNum;
  const el = document.querySelector('[data-day="'+dayNum+'"]');
  if (el) el.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

function updateGlobalProgress() {
  const state = loadState();
  const completedDays = calcProgress(state);
  const pct = Math.round((completedDays / 22) * 100);
  const bar = document.getElementById('globalProgressBar');
  bar.style.width = pct + '%';
  bar.setAttribute('aria-valuenow', completedDays);
  const text = completedDays + '/22 天完成 (' + pct + '%)';
  document.getElementById('globalProgressText').textContent = text;
  bar.setAttribute('aria-valuetext', text);
}

function updateCountdown() {
  const now = new Date();
  const diff = Math.ceil((EXAM_DATE - now) / 86400000);
  document.getElementById('countdownNum').textContent = Math.max(0, diff);
}

function init() {
  let activeDay = getTodayIndex() + 1;
  const hash = window.location.hash;
  if (hash && hash.startsWith('#day')) {
    const d = parseInt(hash.replace('#day',''));
    if (d >= 1 && d <= 22) activeDay = d;
  }
  renderMain(activeDay);
  renderSidebar(activeDay);
  updateGlobalProgress();
  updateCountdown();
  setTimeout(() => {
    const todayIdx = getTodayIndex() + 1;
    const el = document.querySelector('[data-day="'+todayIdx+'"]');
    if (el && activeDay === todayIdx) el.scrollIntoView({ behavior:'smooth', block:'center' });
  }, 200);
}

init();
</script>
